<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MusculoApp – Origem, Inserção e Ação</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand2:#14b8a6; --brand-soft:#ccfbf1;
  --ok:#059669; --ok-soft:#d1fae5; --err:#e11d48; --err-soft:#ffe4e6;
  --o:#2563eb; --o-soft:#dbeafe; --i:#0d9488; --i-soft:#ccfbf1; --a:#7c3aed; --a-soft:#ede9fe;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1220; --card:#131c2e; --text:#e5edf7; --muted:#94a3b8; --line:#243049;
    --brand:#14b8a6; --brand2:#2dd4bf; --brand-soft:#0f2f2c;
    --ok:#34d399; --ok-soft:#08302a; --err:#fb7185; --err-soft:#3a1420;
    --o:#60a5fa; --o-soft:#13243f; --i:#2dd4bf; --i-soft:#0f2f2c; --a:#a78bfa; --a-soft:#251c45;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

/* Top bar */
.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;background:linear-gradient(135deg,#0f766e,#115e59 60%,#134e4a);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(15,118,110,.25);flex-shrink:0}
.logo{display:flex;align-items:center;gap:11px}
.logo .ic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px}
.logo h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.logo p{margin:0;font-size:12px;opacity:.8}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}

main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Bottom nav */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 8px);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:700;position:relative}
.tab .e{font-size:21px;line-height:1.1}
.tab.on{color:var(--brand);background:var(--brand-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--err);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 9px;font-weight:800}
h2.sec:first-child{margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

.modes{display:grid;gap:9px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;padding:13px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.mode .me{font-size:24px;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex-shrink:0}
.mode b{display:block;font-size:14.5px}
.mode small{color:var(--muted);font-size:12.5px}
.mode.on{border-color:var(--brand);background:var(--brand-soft)}

.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}

.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.region{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;box-shadow:var(--shadow);transition:transform .1s}
.region:active{transform:scale(.97)}
.region.all{grid-column:1/-1;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:0}
.region b{display:block;font-size:15px}
.region small{font-size:12px;color:var(--muted)}
.region.all small{color:rgba(255,255,255,.85)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .3s}
.region.all .bar{background:rgba(255,255,255,.3)}
.region.all .bar i{background:#fff}

/* Detail rows (origem / inserção / ação) */
.det{display:grid;gap:8px}
.row{border-radius:13px;padding:10px 12px;border-left:5px solid}
.row small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.row p{margin:0;font-size:14.5px;font-weight:600}
.row.o{background:var(--o-soft);border-color:var(--o)} .row.o small{color:var(--o)}
.row.i{background:var(--i-soft);border-color:var(--i)} .row.i small{color:var(--i)}
.row.a{background:var(--a-soft);border-color:var(--a)} .row.a small{color:var(--a)}

/* Quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;flex-shrink:0}
.prog{flex:1}
.prog .bar{height:10px;margin:0}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;padding:4px 11px;border-radius:99px;margin-bottom:10px}
.qtitle{font-size:17px;font-weight:800;margin:14px 0 10px}
.bigname{font-size:24px;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
input.ans{width:100%;padding:14px 15px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;font-weight:600;outline:none}
input.ans:focus{border-color:var(--brand)}
input.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
input.ans.bad{border-color:var(--err);background:var(--err-soft)}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;background:var(--brand);color:#fff;margin-top:10px;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.btn.dark{background:var(--text);color:var(--bg);box-shadow:none}
.btn.soft{background:var(--bg);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.warn{background:#f59e0b}
.btn:disabled{opacity:.45}
.link{display:block;margin:8px auto 0;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;padding:6px}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.opt[disabled]{opacity:1}
.warnmsg{color:#d97706;font-size:12.5px;font-weight:700;margin:6px 2px 0}

.fb{margin-top:14px;border-radius:18px;padding:15px;border:2px solid;animation:in .25s}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--err-soft);border-color:var(--err)}
.fbh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fbi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
.ok .fbi{background:var(--ok)} .bad .fbi{background:var(--err)}
.fbh small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ok .fbh small{color:var(--ok)} .bad .fbh small{color:var(--err)}
.fbh b{font-size:18px}
.tip{margin-top:10px;font-size:14px;background:var(--card);border-radius:12px;padding:10px 12px}
.tip small{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.attempt{font-size:13px;color:var(--muted);margin:-2px 0 10px}
.attempt s{color:var(--err);font-weight:700}

/* Result */
.result{text-align:center}
.trophy{font-size:56px;margin:4px 0}
.result h2{margin:0;font-size:24px}
.result p{color:var(--muted);margin:4px 0 14px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.rs div{border-radius:14px;padding:12px 4px}
.rs b{display:block;font-size:24px}
.rs span{font-size:11px;font-weight:800;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 4px}
.tag{background:var(--err-soft);color:var(--err);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:700}

/* Study */
.search{width:100%;padding:13px 15px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--brand)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
details.m{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
details.m summary{list-style:none;padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.m summary::-webkit-details-marker{display:none}
details.m summary b{flex:1;font-size:15px}
details.m summary small{color:var(--muted);font-size:12px;font-weight:700}
details.m summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details.m[open] summary::after{transform:rotate(90deg)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex-shrink:0}
.dot.good{background:var(--ok)} .dot.bad{background:var(--err)}
.mbody{padding:0 14px 14px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:44px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">
      <div class="ic">💪</div>
      <div><h1>MusculoApp</h1><p>Origem • Inserção • Ação</p></div>
    </div>
    <div class="chip" id="chip">🔥 0</div>
  </header>

  <main id="main">
    <section id="v-home" class="view"></section>
    <section id="v-quiz" class="view hidden"></section>
    <section id="v-study" class="view hidden"></section>
    <section id="v-errors" class="view hidden"></section>
  </main>

  <nav class="tabs">
    <button class="tab on" data-tab="home"><span class="e">🏠</span>Início</button>
    <button class="tab" data-tab="study"><span class="e">📖</span>Estudar</button>
    <button class="tab" data-tab="errors"><span class="e">🎯</span>Erros<span class="badge hidden" id="errbadge">0</span></button>
  </nav>
</div>

<script>
    const MUSCLES_DB = [
      {
              id: 1,
              region: "Ombro",
              name: "Subescapular",
              aliases: ["subescapular", "musculo subescapular"],
              origem: "Fossa subescapular",
              insercao: "Tubérculo menor do úmero",
              acao: "Rotação medial e adução do ombro",
              explanation: "Fica <strong>abaixo</strong> (sub) da <strong>escápula</strong>, na face costal anterior. É o único músculo do manguito rotador que se insere no tubérculo menor do úmero."
            },
      {
              id: 2,
              region: "Ombro",
              name: "Supra-espinhal",
              aliases: ["supra-espinhal", "supraespinhal", "supra espinal", "supra-espinal", "supraespinal"],
              origem: "Fossa supra-espinhal da escápula",
              insercao: "Tubérculo maior do úmero",
              acao: "Abdução do ombro",
              explanation: "Fica <strong>acima</strong> (supra) da <strong>espinha</strong> da escápula e inicia o movimento de abdução do ombro."
            },
      {
              id: 3,
              region: "Ombro",
              name: "Infra-espinhal",
              aliases: ["infra-espinhal", "infraespinhal", "infra espinal", "infra-espinal", "infraespinal"],
              origem: "Superfície posterior da escápula",
              insercao: "Tubérculo maior do úmero",
              acao: "Rotação lateral e adução do ombro",
              explanation: "Fica <strong>abaixo</strong> (infra) da <strong>espinha</strong> da escápula na parte posterior, atuando na rotação lateral do ombro."
            },
      {
              id: 4,
              region: "Ombro",
              name: "Redondo menor",
              aliases: ["redondo menor"],
              origem: "Escápula posterior, borda lateral",
              insercao: "Tubérculo maior do úmero",
              acao: "Rotação lateral e adução do ombro",
              explanation: "É o músculo <strong>redondo</strong> mais <strong>curto/superior</strong> do manguito rotador, inserindo-se no tubérculo maior."
            },
      {
              id: 5,
              region: "Ombro",
              name: "Redondo maior",
              aliases: ["redondo maior"],
              origem: "Face posterior do ângulo inferior da escápula",
              insercao: "Lábio medial do sulco intertubercular do úmero",
              acao: "Rotação medial e adução do ombro",
              explanation: "É o músculo <strong>redondo</strong> mais <strong>baixo/longo</strong> que vai do ângulo inferior da escápula para a parte anterior do úmero."
            },
      {
              id: 6,
              region: "Ombro",
              name: "Deltoide",
              aliases: ["deltoide", "deltóide"],
              origem: "Terço final da clavícula, acrômio e espinha da escápula",
              insercao: "Tuberosidade deltoidea do úmero",
              acao: "Abdução, extensão e flexão",
              explanation: "Tem formato de <strong>delta</strong> (triângulo invertido) cobrindo o contorno do ombro."
            },
      {
              id: 7,
              region: "Braço",
              name: "Bíceps braquial",
              aliases: ["biceps braquial", "bíceps braquial", "biceps"],
              origem: "Tubérculo supraglenoidal e processo coracoide",
              insercao: "Tuberosidade do rádio",
              acao: "Flexão e supinação do antebraço",
              explanation: "<strong>Bi</strong> = possui <strong>duas</strong> cabeças de origem (curta no processo coracoide e longa no tubérculo supraglenoidal)."
            },
      {
              id: 8,
              region: "Braço",
              name: "Braquial",
              aliases: ["braquial"],
              origem: "Face anterior da metade distal do úmero",
              insercao: "Processo coronoide da ulna",
              acao: "Flexão do antebraço",
              explanation: "Músculo profundo puramente do <strong>braço</strong> que se insere na ulna, sendo o flexor puro do cotovelo."
            },
      {
              id: 9,
              region: "Braço",
              name: "Coracobraquial",
              aliases: ["coracobraquial", "coraco-braquial", "coraco braquial"],
              origem: "Processo coracoide da escápula",
              insercao: "Terço médio do úmero",
              acao: "Flexão e adução do ombro",
              explanation: "O próprio nome entrega a anatomia: liga o processo <strong>coracoide</strong> ao <strong>braço</strong> (úmero)."
            },
      {
              id: 10,
              region: "Braço",
              name: "Tríceps braquial",
              aliases: ["triceps braquial", "tríceps braquial", "triceps"],
              origem: "Tubérculo infraglenoidal, face posterior do úmero e sulco radial",
              insercao: "Olécrano",
              acao: "Extensão do antebraço",
              explanation: "<strong>Tri</strong> = possui <strong>três</strong> cabeças na parte posterior do braço que convergem para o olécrano da ulna."
            },
      {
              id: 11,
              region: "Antebraço",
              name: "Braquiorradial",
              aliases: ["braquiorradial", "braquioradial", "braquio-radial"],
              origem: "Crista supraepicondilar lateral do úmero",
              insercao: "Processo estiloide do rádio",
              acao: "Pronação, supinação e flexão do antebraço",
              explanation: "Liga o <strong>braço</strong> (úmero) até a ponta distal do osso <strong>rádio</strong>."
            },
      {
              id: 12,
              region: "Antebraço",
              name: "Extensor radial longo do carpo",
              aliases: ["extensor radial longo do carpo"],
              origem: "Crista supraepicondilar lateral do úmero",
              insercao: "Base do 2º metacarpal",
              acao: "Extensão do punho e abdução da mão (desvio radial)",
              explanation: "É <strong>longo</strong> e vai para o <strong>carpo/metacarpo</strong> (2º metacarpal) pelo lado do rádio."
            },
      {
              id: 13,
              region: "Antebraço",
              name: "Extensor radial curto do carpo",
              aliases: ["extensor radial curto do carpo"],
              origem: "Epicôndilo lateral do úmero",
              insercao: "Base do 3º metacarpal",
              acao: "Extensão do punho",
              explanation: "É o <strong>curto</strong> que acompanha o extensor radial longo, inserindo-se na base do 3º metacarpal."
            },
      {
              id: 14,
              region: "Antebraço",
              name: "Extensor ulnar do carpo",
              aliases: ["extensor ulnar do carpo"],
              origem: "Epicôndilo lateral do úmero",
              insercao: "Base do 5º metacarpal",
              acao: "Extensão e adução do punho (desvio ulnar)",
              explanation: "Fica do lado da <strong>ulna</strong> (medial) e se insere na base do 5º metacarpal (lado do dedo mínimo)."
            },
      {
              id: 15,
              region: "Antebraço",
              name: "Extensor dos dedos",
              aliases: ["extensor dos dedos", "extensor comum dos dedos"],
              origem: "Epicôndilo lateral do úmero",
              insercao: "Falanges média e distal do 2º ao 5º dedos",
              acao: "Extensão do punho",
              explanation: "Seus quatro tendões percorrem o dorso da mão para abrir (<strong>estender</strong>) os <strong>dedos</strong> do 2º ao 5º."
            },
      {
              id: 31,
              region: "Pescoço",
              name: "Platisma",
              aliases: ["platisma"],
              origem: "Base da mandíbula",
              insercao: "Pele por baixo da clavícula e fáscia peitoral",
              acao: "Traciona o lábio inferior e o ângulo bucal",
              explanation: "Músculo largo e muito fino que lembra uma <strong>lâmina ou placa</strong> superficial cobrindo o pescoço."
            },
      {
              id: 32,
              region: "Pescoço",
              name: "Esternocleidomastoideo",
              aliases: ["esternocleidomastoideo", "esternocleidomastoide", "esternocleidomastóideo"],
              origem: "Clavícula e manúbrio",
              insercao: "Processo mastoide",
              acao: "Flexão da cabeça",
              explanation: "O nome revela suas inserções: <strong>Esterno</strong> + <strong>Cleido</strong> (clavícula) + processo <strong>Mastoide</strong> do crânio."
            },
      {
              id: 33,
              region: "Pescoço",
              name: "Escaleno anterior",
              aliases: ["escaleno anterior"],
              origem: "Vértebras",
              insercao: "Costelas",
              acao: "Inclinação do pescoço e auxilia na inspiração",
              explanation: "Os escalenos lembram uma <strong>escala</strong> (degraus) na lateral do pescoço; este é o feixe mais à frente (<strong>anterior</strong>)."
            },
      {
              id: 34,
              region: "Pescoço",
              name: "Escaleno médio",
              aliases: ["escaleno medio", "escaleno médio"],
              origem: "Vértebras",
              insercao: "Costelas",
              acao: "Inclinação do pescoço e auxilia na inspiração",
              explanation: "É o feixe intermediário (do <strong>meio</strong>) dos três músculos em forma de <strong>escala</strong> no pescoço."
            },
      {
              id: 35,
              region: "Pescoço",
              name: "Escaleno posterior",
              aliases: ["escaleno posterior"],
              origem: "Vértebras",

const KEY = "musculoapp.v1";
let store = {stats:{}, missed:[], best:0, mode:"type", len:10};
let S = null; // sessão do quiz
let lastShown = null; // id da última questão da rodada anterior

function load(){ try{ const s=localStorage.getItem(KEY); if(s) store=Object.assign(store,JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rnd(n){
  if(window.crypto && crypto.getRandomValues){ const u=new Uint32Array(1); crypto.getRandomValues(u); return u[0]%n; }
  return Math.floor(Math.random()*n);
}
const shuffle = a => { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=rnd(i+1);[r[i],r[j]]=[r[j],r[i]];} return r; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[-_]/g," ").replace(/\b(musculo|do|da|dos|das|de)\b/g," ").replace(/\s+/g," ").trim();
const byId = id => MUSCLES_DB.find(m=>m.id===id);
const isMastered = m => { const s=store.stats[m.id]; return !!s && s.last===1 && s.ok>=2; };

function detBlock(m, hide){
  hide = hide||[];
  const rows = [["o","Origem",m.origem],["i","Inserção",m.insercao],["a","Ação",m.acao]];
  return `<div class="det">${rows.filter(r=>!hide.includes(r[0])).map(r=>`<div class="row ${r[0]}"><small>${r[1]}</small><p>${esc(r[2])}</p></div>`).join("")}</div>`;
}

/* ---------- Navegação ---------- */
function show(tab){
  ["home","quiz","study","errors"].forEach(v=>$("v-"+v).classList.toggle("hidden", v!==tab));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===(tab==="quiz"?"home":tab)));
  $("main").scrollTop = 0;
  if(tab==="home") renderHome();
  if(tab==="study") renderStudy();
  if(tab==="errors") renderErrors();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.tab));

function updateChrome(){
  $("chip").textContent = "🔥 Recorde: " + store.best;
  const b=$("errbadge"); b.textContent=store.missed.length; b.classList.toggle("hidden", store.missed.length===0);
}

/* ---------- Início ---------- */
function renderHome(){
  const total = MUSCLES_DB.length;
  const mastered = MUSCLES_DB.filter(isMastered).length;
  let ok=0, err=0; Object.values(store.stats).forEach(s=>{ok+=s.ok;err+=s.err;});
  const acc = ok+err ? Math.round(ok/(ok+err)*100) : 0;

  let h = `<div class="stats">
    <div class="stat"><b>${mastered}/${total}</b><span>Dominados</span></div>
    <div class="stat"><b>${acc}%</b><span>Acertos</span></div>
    <div class="stat"><b>${store.missed.length}</b><span>Para rever</span></div>
  </div>`;

  h += `<h2 class="sec">Modo de jogo</h2><div class="modes">` + MODES.map(m=>
    `<button class="mode ${store.mode===m.id?"on":""}" data-mode="${m.id}"><span class="me">${m.e}</span><span><b>${m.t}</b><small>${m.d}</small></span></button>`).join("") + `</div>`;

  h += `<h2 class="sec">Questões por rodada</h2><div class="seg">` +
    [[10,"10"],[20,"20"],[0,"Todas"]].map(x=>`<button data-len="${x[0]}" class="${store.len===x[0]?"on":""}">${x[1]}</button>`).join("") + `</div>`;

  h += `<h2 class="sec">Escolha a região</h2><div class="regions">`;
  h += `<button class="region all" data-region="all"><b>🎲 Todos os músculos</b><small>${mastered} de ${total} dominados</small><div class="bar"><i style="width:${mastered/total*100}%"></i></div></button>`;
  REGIONS.forEach(r=>{
    const list = MUSCLES_DB.filter(m=>m.region===r);
    const md = list.filter(isMastered).length;
    h += `<button class="region" data-region="${r}"><b>${REGION_EMOJI[r]||"•"} ${r}</b><small>${md}/${list.length} dominados</small><div class="bar"><i style="width:${md/list.length*100}%"></i></div></button>`;
  });
  h += `</div>`;
  h += `<div style="margin:22px 0 8px"><button class="btn warn" id="reset-progress" style="width:100%">🗑️ Limpar histórico de progresso</button></div>`;
  $("v-home").innerHTML = h;

  $("v-home").querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{store.mode=b.dataset.mode;save();renderHome();});
  $("v-home").querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{store.len=+b.dataset.len;save();renderHome();});
  $("v-home").querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.region==="all"?null:b.dataset.region));
  $("reset-progress").onclick = resetProgress;
  updateChrome();
}

/* ---------- Histórico ---------- */
function resetProgress(){
  if(!confirm("Tem certeza que deseja apagar todo o histórico? Acertos, erros, músculos dominados, lista de revisão e recorde serão apagados. Essa ação não pode ser desfeita.")) return;

  store.stats = {};
  store.missed = [];
  store.best = 0;

  save();
  updateChrome();
  renderHome();
}

/* ---------- Quiz ---------- */
function startQuiz(region, customList){
  let pool = customList || (region ? MUSCLES_DB.filter(m=>m.region===region) : MUSCLES_DB);
  // Sempre embaralha: nova ordem a cada rodada, e a 1ª questão nunca repete a última da rodada anterior
  pool = shuffle(pool);
  if(pool.length>1 && lastShown!==null && pool[0].id===lastShown){
    const k = 1 + rnd(pool.length-1);
    [pool[0],pool[k]]=[pool[k],pool[0]];
  }
  if(!customList && store.len>0) pool = pool.slice(0, store.len);
  S = {region, custom:!!customList, deck:pool, i:0, ok:0, bad:0, streak:0, answered:false, missed:[], mode:store.mode, opts:[]};
  show("quiz");
  renderQuestion();
}

function distractors(m, n, field){
  const same = shuffle(MUSCLES_DB.filter(x=>x.id!==m.id && x.region===m.region));
  const other = shuffle(MUSCLES_DB.filter(x=>x.id!==m.id && x.region!==m.region));
  const out=[], seen=new Set([field==="name"?m.name:m.acao]);
  for(const x of [...same,...other]){
    const v = field==="name"?x.name:x.acao;
    if(!seen.has(v)){ seen.add(v); out.push(v); }
    if(out.length>=n) break;
  }
  return out;
}

function renderQuestion(){
  if(S.i>=S.deck.length) return renderResult();
  S.answered=false;
  const m = S.deck[S.i];
  const pct = Math.round(S.i/S.deck.length*100);
  let h = `<div class="qhead"><button class="x" id="qx" aria-label="Sair">✕</button>
    <div class="prog"><div class="qmeta"><span>Questão ${S.i+1} de ${S.deck.length}</span><span>✅ ${S.ok} &nbsp;❌ ${S.bad}${S.streak>=3?" &nbsp;🔥"+S.streak:""}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
  h += `<div class="card"><span class="pill">${esc(m.region)}</span>`;

  if(S.mode==="action"){
    h += `<p class="bigname">${esc(m.name)}</p>${detBlock(m,["a"])}<div class="qtitle">Qual é a ação deste músculo?</div>`;
    S.opts = shuffle([m.acao, ...distractors(m,3,"acao")]);
    h += `<div class="opts" id="opts">${S.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  } else {
    h += detBlock(m) + `<div class="qtitle">Qual é o nome deste músculo?</div>`;
    if(S.mode==="choice"){
      S.opts = shuffle([m.name, ...distractors(m,3,"name")]);
      h += `<div class="opts" id="opts">${S.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    } else {
      h += `<input id="ans" class="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Digite o nome do músculo...">
        <div class="warnmsg hidden" id="warn">Digite uma resposta ou toque em “Não sei”.</div>
        <button class="btn" id="check">Verificar</button>
        <button class="link" id="skip">Não sei / mostrar resposta</button>`;
    }
  }
  h += `<div id="fb"></div></div>`;
  $("v-quiz").innerHTML = h;
  $("main").scrollTop = 0;

  $("qx").onclick = () => { if(confirm("Sair do quiz? O progresso desta rodada será perdido.")) show("home"); };
  if(S.mode==="type"){
    $("check").onclick = () => submitText(false);
    $("skip").onclick = () => submitText(true);
    setTimeout(()=>$("ans").focus(),60);
  } else {
    $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>submitChoice(+b.dataset.k));
  }
}

function submitText(skipped){
  if(S.answered) return;
  const inp=$("ans"), raw=inp.value.trim();
  if(!skipped && !raw){ $("warn").classList.remove("hidden"); inp.focus(); return; }
  const m=S.deck[S.i];
  const targets=[m.name,...(m.aliases||[])].map(norm);
  const ok = !skipped && targets.includes(norm(raw));
  inp.disabled=true; inp.classList.add(ok?"ok":"bad");
  $("check").classList.add("hidden"); $("skip").classList.add("hidden"); $("warn").classList.add("hidden");
  finish(ok, skipped?"(pulou a questão)":raw);
}

function submitChoice(k){
  if(S.answered) return;
  const m=S.deck[S.i];
  const correctVal = S.mode==="action" ? m.acao : m.name;
  const ok = S.opts[k]===correctVal;
  $("opts").querySelectorAll(".opt").forEach((b,idx)=>{
    b.disabled=true;
    if(S.opts[idx]===correctVal) b.classList.add("ok");
    else if(idx===k) b.classList.add("bad");
  });
  finish(ok, S.opts[k]);
}

function finish(ok, attempt){
  S.answered=true;
  const m=S.deck[S.i];
  const st = store.stats[m.id] || (store.stats[m.id]={ok:0,err:0,last:0});
  if(ok){
    S.ok++; S.streak++; st.ok++; st.last=1;
    store.missed = store.missed.filter(id=>id!==m.id);
    if(S.streak>store.best) store.best=S.streak;
  } else {
    S.bad++; S.streak=0; st.err++; st.last=0; S.missed.push(m.id);
    if(!store.missed.includes(m.id)) store.missed.push(m.id);
  }
  save(); updateChrome();

  const last = S.i+1>=S.deck.length;
  $("fb").innerHTML = `<div class="fb ${ok?"ok":"bad"}">
    <div class="fbh"><span class="fbi">${ok?"✓":"✕"}</span><div><small>${ok?"Certo! Excelente!":"Errado — resposta correta"}</small><b>${esc(m.name)}</b></div></div>
    ${!ok?`<div class="attempt">Sua resposta: <s>${esc(attempt)}</s></div>`:""}
    ${detBlock(m)}
    <div class="tip"><small>Explicação &amp; dica</small>${m.explanation}</div>
    <button class="btn dark" id="next">${last?"Ver resultado":"Próximo músculo →"}</button>
  </div>`;
  $("next").onclick=nextQuestion;
  setTimeout(()=>$("fb").scrollIntoView({behavior:"smooth",block:"nearest"}),80);
}

function nextQuestion(){ lastShown=S.deck[S.i].id; S.i++; renderQuestion(); }

function renderResult(){
  const total=S.ok+S.bad, acc= total?Math.round(S.ok/total*100):0;
  const emoji = acc>=90?"🏆":acc>=70?"🎉":acc>=50?"👍":"💪";
  const msg = acc>=90?"Excelente domínio!":acc>=70?"Muito bom, continue assim!":acc>=50?"Bom caminho, revise os erros.":"Vamos reforçar esses músculos!";
  let h = `<div class="card result"><div class="trophy">${emoji}</div><h2>Resultado</h2><p>${msg}</p>
    <div class="rs"><div style="background:var(--ok-soft);color:var(--ok)"><b>${S.ok}</b><span>Acertos</span></div>
    <div style="background:var(--err-soft);color:var(--err)"><b>${S.bad}</b><span>Erros</span></div>
    <div style="background:var(--bg)"><b>${acc}%</b><span>Aproveit.</span></div></div>`;
  if(S.missed.length){
    h += `<h2 class="sec" style="text-align:center">Músculos para reforçar</h2><div class="tags">${S.missed.map(id=>`<span class="tag">${esc(byId(id).name)}</span>`).join("")}</div>
    <button class="btn warn" id="rev">🎯 Praticar só os erros</button>`;
  }
  h += `<button class="btn" id="again">🔄 Jogar novamente</button><button class="btn soft" id="home">Voltar ao início</button></div>`;
  $("v-quiz").innerHTML=h;
  $("main").scrollTop=0;
  if(S.missed.length) $("rev").onclick=()=>startQuiz(null, S.missed.map(byId));
  $("again").onclick=()=>S.custom?startQuiz(null,S.deck):startQuiz(S.region);
  $("home").onclick=()=>show("home");
}

/* ---------- Estudar ---------- */
let studyRegion="Todos", studyQuery="";
function renderStudy(){
  const regs=["Todos",...REGIONS];
  $("v-study").innerHTML = `<input class="search" id="q" type="search" placeholder="🔍 Buscar músculo, origem, inserção ou ação..." value="${esc(studyQuery)}">
    <div class="chips">${regs.map(r=>`<button class="${studyRegion===r?"on":""}" data-r="${r}">${r}</button>`).join("")}</div>
    <div id="slist"></div>`;
  $("q").oninput=e=>{studyQuery=e.target.value;drawStudyList();};
  $("v-study").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{studyRegion=b.dataset.r;renderStudy();});
  drawStudyList();
}
function drawStudyList(){
  const q=norm(studyQuery);
  const list=MUSCLES_DB.filter(m=>(studyRegion==="Todos"||m.region===studyRegion) &&
    (!q || norm([m.name,m.origem,m.insercao,m.acao,m.region].join(" ")).includes(q)));
  $("slist").innerHTML = list.length ? list.map(m=>{
    const s=store.stats[m.id]; const cls = s? (s.last?"good":"bad"):"";
    return `<details class="m"><summary><span class="dot ${cls}"></span><b>${esc(m.name)}</b><small>${esc(m.region)}</small></summary>
      <div class="mbody">${detBlock(m)}<div class="tip"><small>Dica</small>${m.explanation}</div></div></details>`;
  }).join("") : `<div class="empty"><div class="big">🔎</div>Nenhum músculo encontrado.</div>`;
}

/* ---------- Erros ---------- */
function renderErrors(){
  const list = store.missed.map(byId).filter(Boolean);
  if(!list.length){
    $("v-errors").innerHTML = `<div class="empty"><div class="big">🎯</div><b>Nenhum erro para revisar</b><br>Os músculos que você errar aparecem aqui para reforço.</div>`;
    return;
  }
  $("v-errors").innerHTML = `<button class="btn warn" id="pe" style="margin-top:0">🎯 Praticar os ${list.length} erros</button>
    <button class="btn soft" id="ce">Limpar lista de erros</button><h2 class="sec">Para reforçar</h2>` +
    list.map(m=>`<details class="m"><summary><span class="dot bad"></span><b>${esc(m.name)}</b><small>${esc(m.region)}</small></summary>
      <div class="mbody">${detBlock(m)}<div class="tip"><small>Dica</small>${m.explanation}</div></div></details>`).join("");
  $("pe").onclick=()=>startQuiz(null,list);
  $("ce").onclick=()=>{ if(confirm("Limpar a lista de erros?")){store.missed=[];save();updateChrome();renderErrors();} };
}

/* ---------- Teclado (Enter) ---------- */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter" || $("v-quiz").classList.contains("hidden") || !S) return;
  if(S.i>=S.deck.length) return;
  e.preventDefault();
  if(S.answered) nextQuestion();
  else if(S.mode==="type") submitText(false);
});

load(); updateChrome(); show("home");

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
